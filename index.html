<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Laeza</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <div>
                <h1>💰 Keuangan Laeza</h1>
                <p>Nabung woy biar ga boros, semoga tahun depan bisa umroh</p>
            </div>
        </header>

        <!-- DASHBOARD -->
        <section class="dashboard">

            <div class="card saldo">
                <span>Saldo</span>
                <h2 id="saldo">Rp 0</h2>
            </div>

            <div class="card pemasukan">
                <span>Total Pemasukan</span>
                <h2 id="pemasukan">Rp 0</h2>
            </div>

            <div class="card pengeluaran">
                <span>Total Pengeluaran</span>
                <h2 id="pengeluaran">Rp 0</h2>
            </div>

        </section>

        <!-- FORM TRANSAKSI -->
        <section class="form-section">

            <h2>Tambah Transaksi</h2>

            <form id="formTransaksi">

                <div class="form-group">
                    <label>Jenis Transaksi</label>

                    <select id="jenis" required>
                        <option value="">-- Pilih Jenis --</option>
                        <option value="pemasukan">Pemasukan</option>
                        <option value="Pengeluaran">Pengeluaran</option>
                        <option value="pengeluaran">Investasi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="tanggal" required>
                </div>

                <div class="form-group">
                    <label>Kategori</label>

                    <select id="kategori" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Gaji">Gaji</option>
                        <option value="Bonus">Bonus</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Transportasi">Transportasi</option>
                        <option value="Belanja">Belanja</option>
                        <option value="Tagihan">Tagihan</option>
                        <option value="Hiburan">Hiburan</option>
                        <option value="Kesehatan">Kesehatan</option>
                        <option value="Pendidikan">Pendidikan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Keterangan</label>
                    <input
                        type="text"
                        id="keterangan"
                        placeholder="Contoh: Makan siang"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Nominal</label>
                    <input
                        type="number"
                        id="nominal"
                        placeholder="Contoh: 50000"
                        min="1"
                        required
                    >
                </div>

                <button type="submit" class="btn-tambah">
                    + Tambah Transaksi
                </button>

            </form>

        </section>

        <!-- DAFTAR TRANSAKSI -->
        <section class="transaksi-section">

            <div class="section-header">

                <div>
                    <h2>Riwayat Transaksi</h2>
                    <p>Daftar pemasukan dan pengeluaran</p>
                </div>

                <select id="filterJenis">
                    <option value="semua">Semua</option>
                    <option value="pemasukan">Pemasukan</option>
                    <option value="pengeluaran">Pengeluaran</option>
                </select>

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Keterangan</th>
                            <th>Kategori</th>
                            <th>Jenis</th>
                            <th>Nominal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="daftarTransaksi">
                    </tbody>

                </table>

            </div>

            <div id="kosong" class="kosong">
                Belum ada transaksi.
            </div>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "URL_SUPABASE_KAMU";
const SUPABASE_KEY = "PUBLISHABLE_KEY_KAMU";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>

<script src="script.js"></script>

</body>
</html>
